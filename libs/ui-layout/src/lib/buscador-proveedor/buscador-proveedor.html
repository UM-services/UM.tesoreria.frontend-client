<div class="relative w-full">
  <div class="relative flex items-center w-full">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <input 
      type="text" 
      [formControl]="searchQuery" 
      [placeholder]="placeholder"
      (focus)="onFocus()"
      class="block w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-gray-900 placeholder-gray-400 bg-white"
      autocomplete="off">
  </div>
  <div *ngIf="showDropdown" class="absolute z-50 w-full mt-1 bg-white shadow-xl rounded-md border border-gray-200 max-h-60 overflow-y-auto">
    <ul class="py-1">
      <li *ngIf="isLoading" class="px-4 py-3 text-sm text-gray-500 italic flex items-center">
         Buscando...
      </li>
      <li *ngIf="!isLoading && proveedores.length === 0 && searchQuery.value" class="px-4 py-3 text-sm text-gray-500">No se encontraron proveedores.</li>
      <li *ngFor="let p of proveedores" (click)="seleccionar(p)" class="px-4 py-2 hover:bg-indigo-50 cursor-pointer flex justify-between items-center group transition-colors border-b border-gray-50 last:border-0">
         <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-900 group-hover:text-indigo-700">{{ p.razonSocial }}</span>
            <span class="text-xs text-gray-500 font-mono">CUIT: {{ p.cuit }}</span>
         </div>
      </li>
    </ul>
  </div>
</div>
