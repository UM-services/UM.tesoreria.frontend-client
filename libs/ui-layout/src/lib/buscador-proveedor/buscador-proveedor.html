<div class="relative w-full">
  <div class="relative flex items-center w-full">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-um-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>
    <input
      type="text"
      [formControl]="searchQuery"
      [placeholder]="placeholder"
      (focus)="onFocus()"
      class="um-input pl-10 pr-4"
      autocomplete="off"
    />
  </div>
  @if (showDropdown) {
    <div
      class="absolute z-50 w-full mt-1 bg-white shadow-xl rounded border border-um-border max-h-60 overflow-y-auto"
    >
      <ul class="py-1">
        @if (isLoading) {
          <li class="px-4 py-3 text-sm text-um-muted italic flex items-center">Buscando...</li>
        }
        @if (!isLoading && proveedores.length === 0 && searchQuery.value) {
          <li class="px-4 py-3 text-sm text-um-muted">No se encontraron proveedores.</li>
        }
        @for (p of proveedores; track p) {
          <li
            tabindex="0"
            (click)="seleccionar(p)"
            (keydown.enter)="seleccionar(p)"
            class="px-4 py-2 hover:bg-um-selected cursor-pointer flex justify-between items-center group transition-colors border-b border-um-border last:border-0"
          >
            <div class="flex flex-col">
              <span class="text-sm font-bold text-um-ink group-hover:text-um-primary">{{
                p.razonSocial
              }}</span>
              <span class="text-xs text-um-muted font-mono">CUIT: {{ p.cuit }}</span>
            </div>
          </li>
        }
      </ul>
    </div>
  }
</div>
