<div class="relative">
  <input
    #campoTexto
    type="text"
    inputmode="numeric"
    autocomplete="off"
    maxlength="10"
    class="um-input pr-10"
    [id]="inputId || null"
    [placeholder]="placeholder"
    [value]="texto"
    [disabled]="deshabilitado"
    (input)="alEscribir($event)"
    (blur)="alSalir()"
  />

  @if (conCalendario) {
    <button
      type="button"
      class="absolute inset-y-0 right-0 flex items-center pr-3 text-um-muted hover:text-um-primary disabled:opacity-50"
      [disabled]="deshabilitado"
      [attr.aria-label]="'Elegir fecha'"
      tabindex="-1"
      (click)="abrirCalendario()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
    </button>
  }

  <!-- Selector nativo oculto: sólo aporta el calendario; el texto visible es siempre dd/mm/aaaa. -->
  <input
    #nativo
    type="date"
    class="pointer-events-none absolute bottom-0 left-0 h-0 w-0 opacity-0"
    tabindex="-1"
    aria-hidden="true"
    [value]="valorIso"
    (change)="alElegirEnCalendario($event)"
  />
</div>
