<div *ngIf="isOpen" class="relative z-[10005]" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity"></div>
  <div class="fixed inset-0 z-10 w-screen overflow-y-auto" (click)="cerrar()">
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div (click)="$event.stopPropagation()" class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-3xl flex flex-col max-h-[85vh]">
        
        <!-- Header -->
        <div class="bg-blue-600 px-4 py-4 sm:px-6 flex justify-between items-center shrink-0">
          <h3 class="text-lg font-bold text-white flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
            </svg>
            Buscador de Cuentas Contables
          </h3>
          <button type="button" (click)="cerrar()" class="text-white hover:text-gray-200">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
          <div class="p-4 border-b border-gray-200 bg-white shrink-0">
            <div class="relative flex items-center w-full">
              <input type="text" [formControl]="searchQuery" placeholder="Buscar por Nombre o Número de Cuenta..." class="block w-full pl-4 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm text-gray-900" autofocus>
            </div>
            <p *ngIf="errorMessage" class="mt-2 text-sm text-red-600">{{ errorMessage }}</p>
          </div>

          <div class="overflow-y-auto flex-1 bg-white">
            <div *ngIf="isLoading" class="flex justify-center items-center p-8"><svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>
            <div *ngIf="!isLoading && cuentas.length === 0 && searchQuery.value" class="p-8 text-center text-gray-500">No se encontraron cuentas contables.</div>
            <table *ngIf="!isLoading && cuentas.length > 0" class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 sticky top-0 shadow-sm z-10"><tr class="text-left text-xs font-bold text-gray-500 uppercase"><th class="px-6 py-3 w-1/4">Número</th><th class="px-6 py-3 w-1/2">Nombre</th><th class="px-6 py-3 text-right">Acción</th></tr></thead>
              <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let c of cuentas" (dblclick)="seleccionar(c)" class="hover:bg-blue-50 cursor-pointer group">
                  <td class="px-6 py-3 text-sm font-mono text-gray-600">{{ c.numeroCuenta }}</td>
                  <td class="px-6 py-3 text-sm font-bold text-gray-900">{{ c.nombre }}</td>
                  <td class="px-6 py-3 text-right"><button (click)="seleccionar(c)" class="text-blue-600 font-bold text-xs bg-blue-50 px-3 py-1 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">Seleccionar</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse border-t border-gray-200 shrink-0"><button (click)="cerrar()" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-bold text-gray-700 hover:bg-gray-50">Cerrar</button></div>
      </div>
    </div>
  </div>
</div>
