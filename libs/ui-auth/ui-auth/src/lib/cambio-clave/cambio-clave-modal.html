@if (isOpen) {
  <div class="relative z-[9999]" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- 2. Overlay Oscuro (Backdrop) -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>

    <!-- 3. Contenedor de Centrado: Captura clics para cerrar -->
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto" (click)="cerrarModal()">
      <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
        <!-- 4. Panel Blanco del Formulario: Detiene la propagación de clics -->
        <div
          (click)="$event.stopPropagation()"
          class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg flex flex-col max-h-[90vh]"
        >
          <!-- Header: shrink-0 -->
          <div class="bg-white px-4 py-4 sm:px-6 border-b border-gray-200 flex justify-between items-center shrink-0">
            <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">
              Cambiar Clave
            </h3>
            <button
              type="button"
              (click)="cerrarModal()"
              class="rounded-md text-gray-400 hover:text-gray-500 focus:outline-none"
            >
              <span class="sr-only">Cerrar</span>
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Body / Form: overflow-y-auto flex-1 -->
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 overflow-hidden">
            <div class="overflow-y-auto px-4 py-5 sm:p-6 bg-white flex-1 space-y-4">
              @if (errorMessage) {
                <div class="rounded-md bg-red-50 p-4 border border-red-200">
                  <div class="flex">
                    <div class="shrink-0 text-red-500">
                      <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                      </svg>
                    </div>
                    <div class="ml-3">
                      <p class="text-sm font-medium text-red-800">{{ errorMessage }}</p>
                    </div>
                  </div>
                </div>
              }

              @if (successMessage) {
                <div class="rounded-md bg-green-50 p-4 border border-green-200">
                  <div class="flex">
                    <div class="shrink-0 text-green-500">
                      <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                      </svg>
                    </div>
                    <div class="ml-3">
                      <p class="text-sm font-medium text-green-800">{{ successMessage }}</p>
                    </div>
                  </div>
                </div>
              }

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Usuario (Locked) -->
                <div>
                  <label for="uid" class="block text-sm font-medium text-gray-700">Usuario</label>
                  <input
                    id="uid"
                    type="text"
                    formControlName="login"
                    readonly
                    class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 shadow-sm sm:text-sm text-gray-600 cursor-not-allowed px-3 py-2 border"
                  />
                </div>

                <!-- Nombre -->
                <div>
                  <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                  <input
                    id="nombre"
                    type="text"
                    formControlName="nombre"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-um-primary focus:ring-um-primary sm:text-sm px-3 py-2 border"
                  />
                </div>
              </div>

              <!-- Clave Anterior -->
              <div>
                <label for="claveAnterior" class="block text-sm font-medium text-gray-700">Clave Anterior</label>
                <input
                  id="claveAnterior"
                  type="password"
                  formControlName="currentPassword"
                  autocomplete="current-password"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-um-primary focus:ring-um-primary sm:text-sm px-3 py-2 border"
                />
              </div>

              <!-- Clave Nueva -->
              <div>
                <label for="claveNueva" class="block text-sm font-medium text-gray-700">Clave Nueva</label>
                <input
                  id="claveNueva"
                  type="password"
                  formControlName="newPassword"
                  autocomplete="new-password"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-um-primary focus:ring-um-primary sm:text-sm px-3 py-2 border"
                />
              </div>

              <!-- Re - Clave -->
              <div>
                <label for="reClaveNueva" class="block text-sm font-medium text-gray-700">Re - Clave</label>
                <input
                  id="reClaveNueva"
                  type="password"
                  formControlName="reClaveNueva"
                  autocomplete="new-password"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-um-primary focus:ring-um-primary sm:text-sm px-3 py-2 border"
                />
              </div>
            </div>

            <!-- Footer: shrink-0 -->
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200 shrink-0 gap-2">
              <button
                type="submit"
                [disabled]="isLoading"
                class="inline-flex w-full justify-center rounded-md border border-transparent bg-blue-900 px-4 py-2 text-base font-medium text-white shadow-sm hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:ring-offset-2 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50"
              >
                @if (isLoading) {
                  <span>Procesando...</span>
                } @else {
                  <span>Cambiar Clave</span>
                }
              </button>
              <button
                type="button"
                (click)="cerrarModal()"
                [disabled]="isLoading"
                class="mt-3 inline-flex w-full justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-base font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:mt-0 sm:w-auto sm:text-sm"
              >
                Salir
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
}
