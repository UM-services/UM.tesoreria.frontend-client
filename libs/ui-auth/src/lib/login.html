<div class="flex min-h-screen items-center justify-center bg-um-canvas px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div
        class="mx-auto flex h-14 w-14 items-center justify-center rounded bg-um-sidebar text-white shadow-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-7 w-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
      <p class="um-eyebrow mt-6">Tesorería</p>
      <h1 class="um-page-title text-center">UM Tesorería</h1>
      <p class="um-page-desc">Ingresa tus credenciales para continuar.</p>
    </div>

    <div class="rounded-lg border border-um-border bg-white p-8 shadow-sm">
      @if (errorMessage) {
        <div class="um-alert um-alert-error mb-6" role="alert">{{ errorMessage }}</div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="login" class="um-label">Usuario</label>
          <input
            id="login"
            type="text"
            formControlName="login"
            autocomplete="username"
            placeholder="Ej: jperez"
            class="um-input"
            [ngClass]="{
              'um-input-invalid':
                loginForm.get('login')?.invalid && loginForm.get('login')?.touched,
            }"
          />
        </div>

        <div>
          <label for="password" class="um-label">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="um-input"
            [ngClass]="{
              'um-input-invalid':
                loginForm.get('password')?.invalid && loginForm.get('password')?.touched,
            }"
          />
        </div>

        <div class="flex items-center justify-end pt-1">
          <button
            type="button"
            (click)="loginForm.reset()"
            class="text-sm font-medium text-um-muted hover:text-um-ink focus:outline-none focus-visible:underline"
          >
            Limpiar campos
          </button>
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="um-btn-primary flex w-full items-center justify-center"
        >
          @if (isLoading) {
            <svg
              class="-ml-1 mr-2 h-4 w-4 animate-spin text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          }
          {{ isLoading ? 'Autenticando...' : 'Iniciar Sesión' }}
        </button>
      </form>
    </div>

    <p class="mt-8 text-center text-xs text-um-muted">Universidad de Montevideo · Tesorería</p>
  </div>
</div>
