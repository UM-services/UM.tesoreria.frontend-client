server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Resolver DNS interno de Docker con TTL dinámico
    resolver 127.0.0.11 valid=10s ipv6=off;

    # === EL TRUCO MAGICO: Proxy Inverso Integrado ===
    # Cualquier peticion que empiece con /api/ la atrapa Nginx
    # y se la manda en secreto por la red interna de Docker al Gateway
    location /api/ {
        set $upstream_gateway http://tesoreria-gateway-service:8301;
        proxy_pass $upstream_gateway$request_uri;

        # Operaciones contables largas (la regeneración del asiento de ingreso tarda ~1 min): con
        # el default de 60 s Nginx devuelve 504 aunque el core termine bien la transacción.
        proxy_connect_timeout 15s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demas (las vistas de Angular) lo sirve Nginx normalmente
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:html|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
