<div class="max-w-3xl mx-auto space-y-6 mt-8">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Facturas Pendientes</h1>
      <p class="mt-1 text-sm text-gray-500">Reporte de facturas de proveedores pendientes de pago.</p>
    </div>
  </div>

  <!-- Messages -->
  <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md shadow-sm">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3"><p class="text-sm text-red-700">{{ errorMessage }}</p></div>
    </div>
  </div>
  
  <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 rounded-md shadow-sm">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3"><p class="text-sm text-green-700">{{ successMessage }}</p></div>
    </div>
  </div>

  <!-- Form Container -->
  <div class="bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-xl md:col-span-2">
    <form [formGroup]="reporteForm" (ngSubmit)="descargarPlanilla()" class="px-4 py-6 sm:p-8">
      <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6 items-end">
        
        <!-- Fecha Desde -->
        <div class="sm:col-span-2">
          <label for="desde" class="block text-sm font-medium leading-6 text-gray-900">Desde <span class="text-red-500">*</span></label>
          <div class="mt-2">
            <input type="date" formControlName="desde" id="desde" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6">
          </div>
        </div>

        <!-- Boton Duplicar (Atajo) -->
        <div class="sm:col-span-1 text-center">
          <button type="button" (click)="duplicarFecha()" title="Copiar fecha al campo Hasta" class="inline-flex items-center justify-center rounded-md bg-white px-2.5 py-1.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 mb-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Fecha Hasta -->
        <div class="sm:col-span-2">
          <label for="hasta" class="block text-sm font-medium leading-6 text-gray-900">Hasta <span class="text-red-500">*</span></label>
          <div class="mt-2">
            <input type="date" formControlName="hasta" id="hasta" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm sm:leading-6">
          </div>
        </div>

      </div>

      <!-- Form Actions -->
      <div class="mt-8 flex items-center justify-end gap-x-4 border-t border-gray-900/10 pt-6">
        <button type="button" [disabled]="isLoading" class="text-sm font-semibold leading-6 text-gray-900 hover:text-blue-600 transition-colors">Cancelar</button>
        <button type="submit" [disabled]="isLoading || reporteForm.invalid" class="rounded-md bg-blue-600 px-6 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 transition-colors flex items-center">
            <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" class="-ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
          Descargar Excel
        </button>
      </div>
    </form>
  </div>
</div>
