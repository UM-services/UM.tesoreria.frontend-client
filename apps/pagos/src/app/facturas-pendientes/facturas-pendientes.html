<div class="max-w-3xl mx-auto space-y-6 mt-8">
  <!-- Page Header -->
  <div class="um-page-header">
    <div>
      <p class="um-eyebrow">Pagos / Facturas</p>
      <h1 class="um-page-title">Facturas Pendientes</h1>
      <p class="mt-1 text-sm text-um-muted">
        Reporte de facturas de proveedores pendientes de pago.
      </p>
    </div>
  </div>

  <!-- Messages -->
  @if (errorMessage) {
    <div class="um-alert um-alert-error">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ errorMessage }}</p>
        </div>
      </div>
    </div>
  }

  @if (successMessage) {
    <div class="um-alert um-alert-success">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-green-700">{{ successMessage }}</p>
        </div>
      </div>
    </div>
  }

  <!-- Form Container -->
  <div class="bg-white shadow-sm ring-1 ring-um-ink/5 sm:rounded-xl md:col-span-2">
    <form [formGroup]="reporteForm" (ngSubmit)="descargarPlanilla()" class="px-4 py-6 sm:p-8">
      <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6 items-end">
        <!-- Fecha Desde -->
        <div class="sm:col-span-2">
          <label for="desde" class="block text-sm font-medium leading-6 text-um-ink"
            >Desde <span class="text-red-500">*</span></label
          >
          <div class="mt-2">
            <input
              type="date"
              formControlName="desde"
              id="desde"
              class="block w-full rounded border-0 py-1.5 text-um-ink shadow-sm ring-1 ring-inset ring-um-border-strong focus:ring-2 focus:ring-inset focus:ring-um-primary sm:text-sm sm:leading-6"
            />
          </div>
        </div>

        <!-- Boton Duplicar (Atajo) -->
        <div class="sm:col-span-1 text-center">
          <button
            type="button"
            (click)="duplicarFecha()"
            title="Copiar fecha al campo Hasta"
            class="inline-flex items-center justify-center rounded bg-white px-2.5 py-1.5 text-sm font-semibold text-um-ink shadow-sm ring-1 ring-inset ring-um-border-strong hover:bg-um-surface mb-1"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 text-um-muted"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 5l7 7-7 7M5 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <!-- Fecha Hasta -->
        <div class="sm:col-span-2">
          <label for="hasta" class="block text-sm font-medium leading-6 text-um-ink"
            >Hasta <span class="text-red-500">*</span></label
          >
          <div class="mt-2">
            <input
              type="date"
              formControlName="hasta"
              id="hasta"
              class="block w-full rounded border-0 py-1.5 text-um-ink shadow-sm ring-1 ring-inset ring-um-border-strong focus:ring-2 focus:ring-inset focus:ring-um-primary sm:text-sm sm:leading-6"
            />
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="mt-8 flex items-center justify-end gap-x-4 border-t border-um-border pt-6">
        <button
          type="button"
          [disabled]="isLoading"
          class="text-sm font-semibold leading-6 text-um-ink hover:text-um-primary transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isLoading || reporteForm.invalid"
          class="rounded bg-um-primary px-6 py-2 text-sm font-semibold text-white shadow-sm hover:bg-um-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 transition-colors flex items-center"
        >
          @if (isLoading) {
            <svg
              class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          }
          @if (!isLoading) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="-ml-1 mr-2 h-4 w-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
              />
            </svg>
          }
          Descargar Excel
        </button>
      </div>
    </form>
  </div>
</div>
