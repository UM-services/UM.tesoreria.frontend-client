name: PR CI Validation

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate-affected:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify package metadata synchronization
        run: node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); const lock=JSON.parse(fs.readFileSync('package-lock.json')); const root=lock.packages['']; if (pkg.version !== lock.version || pkg.version !== root.version) { console.error('package.json and package-lock.json versions are out of sync'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Lint affected projects
        run: npx nx affected -t lint --base=origin/main

      - name: Test affected projects
        run: npx nx affected -t test --base=origin/main

      - name: Build affected projects
        run: npx nx affected -t build --base=origin/main
