name: Deploy staging

on:
  pull_request:
    branches: ["staging"]
  push:
    branches: ["staging"]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npx nx run-many -t lint

      - name: Test all projects
        run: npx nx run-many -t test

      - name: Build all apps
        run: npx nx run-many -t build --configuration=production

  build-images:
    name: Build and publish staging images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all apps with Nx
        run: npx nx run-many -t build --configuration=production

      - name: Upload dist build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-apps
          path: dist/apps/

  publish-docker:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      matrix:
        app: [administrador, chequeras, compras, contable, contratados, pagos, guarani]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-apps
          path: dist/apps/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/um.tesoreria.${{ matrix.app }}-client
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy staging services
    needs: publish-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, linux, staging]
    environment:
      name: staging
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy tesoreria frontend clients
        run: /data/docker/env-staging/deploy-tesoreria-frontend-staging.sh "${GITHUB_SHA}"
