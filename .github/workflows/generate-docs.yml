name: Documentation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read
  pull-requests: read

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTS is safer than 22 for some native bindings like emnapi

      - name: Install Dependencies
        # Using npm install instead of npm ci to bypass lockfile out-of-sync issues on CI, 
        # though ideally the lockfile should be fixed in the repo.
        run: npm install

      - name: Generate Dependency Tree
        run: |
          mkdir -p docs-site
          npm list --all > docs-site/dependency-tree.txt || true

      - name: Generate Angular Architecture Documentation (Compodoc)
        # We use npx to run compodoc locally without polluting global space.
        # This is a best practice for Angular workspaces.
        run: |
          npx @compodoc/compodoc -p tsconfig.base.json -d docs-site/architecture --name "Tesoreria Frontend Architecture" --theme readthedocs --hideGenerator

      - name: Fetch GitHub Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/milestones" > docs-site/milestones.json
          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/issues?state=all&per_page=100" > docs-site/issues.json
          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pulls?state=all&per_page=100" > docs-site/prs.json

      - name: Prepare Pages Portal
        run: |
          # Copy essential markdown files
          cp README.md CHANGELOG.md docs-site/ 2>/dev/null || true
          
          # Create an index.html that redirects to the architecture docs, 
          # or serves as a portal linking to the JSON data and Compodoc.
          cat > docs-site/index.html << 'INDEX'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Tesoreria Frontend Documentation</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
              h1 { color: #2563eb; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
              .card { border: 1px solid #e5e7eb; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
              a { color: #2563eb; text-decoration: none; font-weight: bold; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>📚 Tesoreria Frontend Portal</h1>
            <div class="card">
              <h2><a href="architecture/index.html">🧩 Angular Architecture (Compodoc)</a></h2>
              <p>Explore modules, components, services, and routing structures visually.</p>
            </div>
            <div class="card">
              <h2>📊 Project Metrics (Raw JSON)</h2>
              <ul>
                <li><a href="issues.json">Issues</a></li>
                <li><a href="prs.json">Pull Requests</a></li>
                <li><a href="milestones.json">Milestones</a></li>
                <li><a href="dependency-tree.txt">NPM Dependency Tree</a></li>
              </ul>
            </div>
          </body>
          </html>
          INDEX

      - name: Generate Wiki Portal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git clone https://github.com/${{ github.repository }}.wiki.git wiki || {
              echo "Wiki repository not initialized. Creating local portal only."
              exit 0
          }
          
          cd wiki
          cat > Home.md << 'EOF'
          # 📋 Wiki - Tesorería Frontend

          La documentación ha evolucionado. Toda la **documentación técnica, arquitectura interactiva de Angular y métricas** se compilan automáticamente con cada Commit/PR y se publican en GitHub Pages.

          ## ➡️ [Acceder al Portal de Documentación (GitHub Pages)](https://$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]').github.io/$(echo ${{ github.repository }} | cut -d'/' -f2)/)
          
          *(Asegúrate de que GitHub Pages esté habilitado en Settings > Pages apuntando a GitHub Actions)*
          EOF
          
          rm -f "Estado-del-Proyecto.md" "Pull-Requests.md"
          
          git add .
          git commit -m "Update Wiki portal to point to GitHub Pages" || echo "No changes"
          
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            git push --set-upstream https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git master || true
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy-pages:
    needs: generate-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
