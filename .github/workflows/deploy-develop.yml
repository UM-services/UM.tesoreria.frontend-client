name: Deploy develop

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npx nx run-many -t lint

      - name: Test all projects
        run: npx nx run-many -t test

      # En los PR la imagen no se construye, asi que el build de Nx es el unico
      # chequeo de compilacion previo a la fusion. En el push se omite porque el
      # Dockerfile multistage ya compila cada app dentro de la imagen.
      - name: Build all apps
        if: github.event_name == 'pull_request'
        run: npx nx run-many -t build --configuration=production

  publish-docker:
    name: Build and publish develop images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: develop
    strategy:
      fail-fast: false
      matrix:
        app: [administrador, chequeras, compras, contable, contratados, pagos, guarani, externo-consulta]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/um.tesoreria.${{ matrix.app }}-client
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Etapa de compilacion dentro de la imagen: reemplaza al viejo ciclo
      # `nx run-many -t build` + upload/download del artefacto dist/apps.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy develop services
    needs: publish-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, develop]
    environment:
      name: develop
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy tesoreria frontend clients
        run: /kibaig0ahNgashee/infraestructura/um/env-develop/deploy-tesoreria-frontend-develop.sh "${GITHUB_SHA}"
