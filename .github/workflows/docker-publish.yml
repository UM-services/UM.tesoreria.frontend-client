name: UM.tesoreria.frontend-client Build and Push Images

on:
  push:
    branches: [ "main" ]

jobs:
  publish-docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [administrador, chequeras, compras, contable, contratados, pagos, guarani, externo-consulta]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/um.tesoreria.${{ matrix.app }}-client
          tags: |
            type=sha
            type=raw,value=${{ github.sha }}
            latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # El Dockerfile es multistage: compila la app con Nx dentro de la imagen,
      # asi que no hace falta `npm ci` + `nx build` + artefactos de dist en CI.
      # La imagen depende solo del commit chequeado, nunca de un `dist/` local.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
