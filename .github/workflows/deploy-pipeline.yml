name: Deploy Pipeline

# Workflow reutilizable del estándar UM de clientes Angular.
# Los llamadores (docker-publish.yml, deploy-develop.yml, deploy-staging.yml)
# aportan environment, matriz de apps y, si aplica, runner y script de deploy.
#
# Criterios unificados con um.haberes.frontend-client:
#  - PR: verify corre lint + test + build (el build de Nx es el unico chequeo
#    de compilacion previo a la fusion, porque todavia no existe imagen).
#  - Push: verify omite `nx build`; el Dockerfile multistage compila cada app
#    DENTRO de la imagen, asi que la publicacion ya es el chequeo de compilacion.
#  - Imagen = f(x del fuente), nunca `COPY dist/` de un artefacto previo.
#  - Tag por push: sha completo; `latest` solo cuando publishLatest=true (main).

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used by build, publish and deploy jobs
        type: string
        required: true
      apps:
        description: JSON list of app names to build (matrix)
        type: string
        required: true
      deploy:
        description: Whether to run the deployment job on the self-hosted runner
        type: boolean
        required: false
        default: false
      deployRunner:
        description: Self-hosted runner label for the target environment (e.g. develop, staging)
        type: string
        required: false
        default: ''
      deployScript:
        description: Deployment script executed on the self-hosted runner
        type: string
        required: false
        default: ''
      publishLatest:
        description: Also tag the published images with latest
        type: boolean
        required: false
        default: false
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npx nx run-many -t lint

      - name: Test all projects
        run: npx nx run-many -t test

      # En los PR la imagen no se construye, asi que el build de Nx es el unico
      # chequeo de compilacion previo a la fusion. En el push se omite porque el
      # Dockerfile multistage ya compila cada app dentro de la imagen.
      - name: Build all apps
        if: github.event_name == 'pull_request'
        run: npx nx run-many -t build --configuration=production

  publish-docker:
    name: Build and publish ${{ inputs.environment }} images
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/um.tesoreria.${{ matrix.app }}-client
          tags: |
            type=raw,value=${{ github.sha }}
            ${{ inputs.publishLatest && 'latest' || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Etapa de compilacion dentro de la imagen: no hay upload/download de
      # dist/. La imagen depende solo del commit chequeado.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy ${{ inputs.environment }} services
    needs: publish-docker
    if: github.event_name == 'push' && inputs.deploy
    runs-on: [self-hosted, linux, "${{ inputs.deployRunner }}"]
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy tesoreria frontend clients
        run: ${{ inputs.deployScript }} "${GITHUB_SHA}"
